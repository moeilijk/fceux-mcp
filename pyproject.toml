[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fceux-mcp"
version = "0.1.0"
description = "MCP server for the FCEUX NES emulator."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
]

[project.scripts]
fceux-mcp = "fceux_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["fceux_mcp"]
